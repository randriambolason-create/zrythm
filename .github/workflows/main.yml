
name: CHM DAW - Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Zrythm
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          conan --version

      - name: Configure Conan
        shell: pwsh
        run: |
          conan config install conan
          git submodule update --init --recursive
          conan remote add conan-local-index ext/conan-center-index
          python tools/export_conan_recipes.py

      - name: Install dependencies
        shell: pwsh
        run: |
          conan install . -pr:h msvc_release -pr:b msvc_release --build=missing

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake --preset default

      - name: Build Zrythm
        shell: pwsh
        run: |
          cmake --build conanbuild/Release --config Release --parallel 2

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CHM-DAW-Windows
          path: |
            conanbuild/Release/**/*.exe
            conanbuild/Release/**/*.dll
          if-no-files-found: error
